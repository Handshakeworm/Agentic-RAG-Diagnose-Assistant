<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic-RAG 医疗问诊助手 · Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgb(203 213 225); border-radius: 3px; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .dot-typing { display: inline-flex; gap: 4px; }
    .dot-typing span {
      width: 6px; height: 6px; background: rgb(148 163 184);
      border-radius: 50%; animation: dot 1.2s infinite ease-in-out;
    }
    .dot-typing span:nth-child(2) { animation-delay: 0.2s; }
    .dot-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%, 60%, 100% { transform: scale(0.7); opacity: 0.5; }
      30%           { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen" x-data="app()" x-init="init()" x-cloak>

<!-- ────────────── 顶栏 ────────────── -->
<header class="bg-white border-b border-slate-200" x-show="token">
  <div class="max-w-3xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">医</div>
      <div>
        <div class="text-sm font-semibold">问诊助手</div>
        <div class="text-xs text-slate-400">Agentic-RAG Demo</div>
      </div>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <span class="text-slate-500" x-text="email"></span>
      <button @click="logout()" class="text-slate-400 hover:text-slate-700 transition">退出</button>
    </div>
  </div>
</header>

<!-- ────────────── 登录视图 ────────────── -->
<main x-show="!token" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl text-white font-bold text-xl mb-3 shadow-sm">医</div>
      <h1 class="text-2xl font-semibold tracking-tight">问诊助手</h1>
      <p class="text-sm text-slate-500 mt-1">Agentic-RAG Medical Care Assistant · Portfolio Demo</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <!-- Tab 切换 -->
      <div class="flex gap-1 bg-slate-100 rounded-xl p-1 mb-5">
        <button @click="loginTab = 'demo'"
                :class="loginTab === 'demo' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500'"
                class="flex-1 text-sm font-medium py-2 rounded-lg transition">
          演示账号
        </button>
        <button @click="loginTab = 'manual'"
                :class="loginTab === 'manual' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500'"
                class="flex-1 text-sm font-medium py-2 rounded-lg transition">
          账号登录
        </button>
      </div>

      <!-- Demo 账号 tab -->
      <div x-show="loginTab === 'demo'" class="space-y-2.5">
        <template x-for="d in demos" :key="d.email">
          <button @click="loginDemo(d.email)"
                  :disabled="loading"
                  class="w-full text-left p-4 border border-slate-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50/50 transition disabled:opacity-50">
            <div class="flex items-start justify-between">
              <div>
                <div class="font-medium text-sm" x-text="d.name"></div>
                <div class="text-xs text-slate-500 mt-0.5" x-text="d.tag"></div>
              </div>
              <span class="text-xs text-slate-400" x-text="d.email"></span>
            </div>
            <div class="text-xs text-slate-400 mt-2" x-text="d.scenario"></div>
          </button>
        </template>
      </div>

      <!-- 手动登录 / 注册 tab -->
      <div x-show="loginTab === 'manual'" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5">邮箱</label>
          <input type="email" x-model="email_input" placeholder="you@example.com"
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5">密码</label>
          <input type="password" x-model="password_input" placeholder="••••••••"
                 @keydown.enter="manualLogin()"
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition" />
        </div>
        <div class="flex gap-2 pt-1">
          <button @click="manualLogin()" :disabled="loading"
                  class="flex-1 bg-indigo-600 text-white text-sm font-medium py-2.5 rounded-xl hover:bg-indigo-700 transition disabled:opacity-50">
            <span x-show="!loading">登录</span>
            <span x-show="loading">登录中…</span>
          </button>
          <button @click="manualRegister()" :disabled="loading"
                  class="flex-1 bg-white border border-slate-200 text-slate-700 text-sm font-medium py-2.5 rounded-xl hover:bg-slate-50 transition disabled:opacity-50">
            注册
          </button>
        </div>
      </div>

      <p x-show="errorMsg" x-text="errorMsg" class="text-xs text-red-600 mt-3 text-center fade-in"></p>
    </div>

    <p class="text-xs text-slate-400 text-center mt-6">
      本系统尚处于探索和测试阶段,AI 输出仅作分诊参考,尚不能完全替代医生;真实就医请结合执业医师诊断。
    </p>
  </div>
</main>

<!-- ────────────── 聊天视图 ────────────── -->
<main x-show="token" class="max-w-3xl mx-auto px-4 py-6">

  <!-- 消息流 -->
  <div class="space-y-4 mb-32" x-ref="msgList">
    <!-- 起始空态提示 -->
    <div x-show="messages.length === 0" class="text-center py-12 fade-in">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-sm mb-4 border border-slate-100">
        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
      </div>
      <h2 class="text-lg font-semibold">请描述您的症状</h2>
      <p class="text-sm text-slate-500 mt-1">例如:"昨天开始上腹部疼痛,饭后加重,伴反酸"</p>
    </div>

    <!-- 消息列表 -->
    <template x-for="(msg, i) in messages" :key="i">
      <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'" class="fade-in">
        <div :class="msg.role === 'user'
                       ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-md'
                       : 'bg-white text-slate-800 rounded-2xl rounded-tl-md border border-slate-100 shadow-sm'"
             class="max-w-[85%] px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap" x-html="msg.html || msg.text">
        </div>
      </div>
    </template>

    <!-- ──── 结构化追问 form 气泡(每条 pending_question 一行控件,在对话区内) ──── -->
    <div x-show="pendingForm" class="flex justify-start fade-in">
      <div class="max-w-[85%] w-full bg-white text-slate-800 rounded-2xl rounded-tl-md border border-slate-100 shadow-sm px-4 py-3 text-sm">
        <p class="text-xs text-slate-400 mb-3">请逐项回答 ↓</p>
        <template x-for="(q, qi) in (pendingForm?.questions || [])" :key="qi">
          <div class="py-3 border-t border-slate-100 first:border-0 first:pt-0 space-y-2">
            <p class="text-slate-700 leading-relaxed" x-text="q.question || '(无问题文本)'"></p>

            <!-- type=obstetric: 两组 yes/no 按钮 -->
            <template x-if="q.type === 'obstetric'">
              <div class="space-y-1.5 pt-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs text-slate-500 w-10 shrink-0">怀孕</span>
                  <template x-for="opt in [{v:'yes',label:'是'},{v:'no',label:'否'},{v:'unknown',label:'不清楚'}]" :key="opt.v">
                    <button @click="setObstetricChoice(qi, 'preg', opt.v)"
                            :class="(formAnswers[qi] && formAnswers[qi].preg === opt.v)
                                      ? 'bg-indigo-600 text-white border-indigo-600'
                                      : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'"
                            class="border rounded-full px-3 py-1 text-xs transition" x-text="opt.label"></button>
                  </template>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs text-slate-500 w-10 shrink-0">哺乳</span>
                  <template x-for="opt in [{v:'yes',label:'是'},{v:'no',label:'否'},{v:'unknown',label:'不清楚'}]" :key="opt.v">
                    <button @click="setObstetricChoice(qi, 'lact', opt.v)"
                            :class="(formAnswers[qi] && formAnswers[qi].lact === opt.v)
                                      ? 'bg-indigo-600 text-white border-indigo-600'
                                      : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'"
                            class="border rounded-full px-3 py-1 text-xs transition" x-text="opt.label"></button>
                  </template>
                </div>
              </div>
            </template>

            <!-- type=report_upload: N 个独立报告框,每框 = 一份独立报告(可多文件:PDF 1 个或图片多张)
                 2026-05-23 X4:真发后端 - 提交时逐文件 POST /diagnose/upload,组装 exam_results
                 走 SSE,后端 ①.5 真调 parse_reports 多模态解析 -->
            <template x-if="q.type === 'report_upload'">
              <div class="space-y-3">
                <!-- 每份报告框(label + 文件选择 + 已选列表 + 单独移除) -->
                <template x-for="(g, gi) in (formAnswers[qi]?.groups || [{label: '', files: []}])" :key="gi">
                  <div class="border border-slate-200 rounded-lg p-3 space-y-2 bg-slate-50/40">
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-slate-500 shrink-0" x-text="'报告 ' + (gi + 1)"></span>
                      <input type="text" :value="g.label"
                             @input="setReportGroupLabel(qi, gi, $event.target.value)"
                             placeholder="如:血常规 / 腹部B超(选填)"
                             class="flex-1 border border-slate-200 rounded-md px-2 py-1 text-xs focus:outline-none focus:border-indigo-400 bg-white">
                      <button x-show="(formAnswers[qi]?.groups || []).length > 1"
                              @click="removeReportGroup(qi, gi)"
                              class="text-xs text-slate-400 hover:text-rose-600 shrink-0"
                              title="移除此份报告">× 移除</button>
                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <button @click="document.getElementById('fileInputForm_' + qi + '_' + gi)?.click()"
                              class="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg px-3 py-1.5 text-xs hover:bg-indigo-100 transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        选择文件
                      </button>
                      <!-- Alpine :x-ref 不支持动态绑定,改用原生 :id + getElementById -->
                      <input type="file" :id="'fileInputForm_' + qi + '_' + gi" class="hidden"
                             accept="image/*,application/pdf" multiple
                             @change="onReportGroupFilesPicked(qi, gi, $event)">
                      <span class="text-xs text-slate-400">PDF 选 1 个 / 图片可多张</span>
                    </div>
                    <template x-if="g.files?.length">
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="(f, fi) in g.files" :key="fi">
                          <span class="inline-flex items-center gap-1 bg-white border border-slate-200 rounded-full pl-2.5 pr-1 py-0.5 text-xs text-slate-600">
                            <span x-text="f.name" class="max-w-[10rem] truncate"></span>
                            <button @click="removeReportGroupFile(qi, gi, fi)" class="w-4 h-4 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-700 flex items-center justify-center">×</button>
                          </span>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <div class="flex items-center gap-2 flex-wrap">
                  <button @click="addReportGroup(qi)"
                          class="text-xs bg-white hover:bg-slate-50 text-indigo-600 border border-indigo-200 rounded-lg px-3 py-1.5 transition">
                    + 添加另一份报告
                  </button>
                  <button @click="formAnswers[qi] = { skip: true, groups: [] }"
                          class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-full px-2.5 py-0.5">无,跳过</button>
                </div>
                <template x-if="formAnswers[qi]?.skip">
                  <p class="text-xs text-slate-400">已选择跳过</p>
                </template>
              </div>
            </template>

            <!-- treatments slot 专用:分框模式(每框 1 条 "<药/治疗>: <反应>",符合后端 list[str] 半结构化) -->
            <template x-if="q.type === 'slot' && q.slot === 'treatments'">
              <div class="space-y-2">
                <template x-for="(e, ei) in (formAnswers[qi]?.entries || [{drug: '', response: ''}])" :key="ei">
                  <div class="border border-slate-200 rounded-lg p-2.5 bg-slate-50/40 space-y-1.5">
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-slate-500 shrink-0" x-text="'第 ' + (ei + 1) + ' 条'"></span>
                      <button x-show="(formAnswers[qi]?.entries || []).length > 1"
                              @click="removeTreatmentEntry(qi, ei)"
                              class="ml-auto text-xs text-slate-400 hover:text-rose-600 shrink-0">× 移除</button>
                    </div>
                    <div class="flex gap-2">
                      <input type="text" :value="e.drug"
                             @input="setTreatmentField(qi, ei, 'drug', $event.target.value)"
                             placeholder="用了什么(药 / 热敷 / 休息...)"
                             class="flex-1 border border-slate-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-400 bg-white">
                      <input type="text" :value="e.response"
                             @input="setTreatmentField(qi, ei, 'response', $event.target.value)"
                             placeholder="反应(无效 / 部分缓解 / 加重...)"
                             class="flex-1 border border-slate-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-400 bg-white">
                    </div>
                  </div>
                </template>
                <div class="flex items-center gap-2 flex-wrap">
                  <button @click="addTreatmentEntry(qi)"
                          class="text-xs bg-white hover:bg-slate-50 text-indigo-600 border border-indigo-200 rounded-lg px-3 py-1 transition">
                    + 添加更多
                  </button>
                  <button @click="formAnswers[qi] = { entries: [], skip: true }"
                          class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-full px-2.5 py-0.5">无</button>
                  <button @click="formAnswers[qi] = { entries: [], unknown: true }"
                          class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-full px-2.5 py-0.5">不清楚</button>
                </div>
                <p x-show="formAnswers[qi]?.skip" class="text-xs text-slate-400">未自行处理</p>
                <p x-show="formAnswers[qi]?.unknown" class="text-xs text-slate-400">已选择不清楚</p>
              </div>
            </template>

            <!-- 其他 type: 单行/多行文本框 + 快捷"无 / 不清楚"按钮 -->
            <template x-if="q.type !== 'obstetric' && q.type !== 'report_upload' && !(q.type === 'slot' && q.slot === 'treatments')">
              <div class="space-y-1.5">
                <textarea :value="formAnswers[qi] || ''"
                          @input="formAnswers[qi] = $event.target.value"
                          rows="1"
                          placeholder="请输入..."
                          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400 resize-none"></textarea>
                <div class="flex gap-1.5">
                  <button @click="formAnswers[qi] = '无'"
                          class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-full px-2.5 py-0.5">无</button>
                  <button @click="formAnswers[qi] = '不清楚'"
                          class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-full px-2.5 py-0.5">不清楚</button>
                </div>
              </div>
            </template>
          </div>
        </template>

        <div class="pt-3 mt-1 border-t border-slate-100 flex justify-end">
          <button @click="submitForm()" :disabled="thinking"
                  class="bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl hover:bg-indigo-700 transition disabled:opacity-30">
            提交回答
          </button>
        </div>
      </div>
    </div>

    <!-- 正在思考(SSE 推 progress 时显示当前阶段灰字,node_done 时下方追加中间产物摘要)-->
    <div x-show="thinking" class="flex justify-start fade-in">
      <div class="bg-white border border-slate-100 rounded-2xl rounded-tl-md shadow-sm px-4 py-3 max-w-[28rem]">
        <div class="flex items-center gap-3">
          <div class="dot-typing"><span></span><span></span><span></span></div>
          <span x-show="currentProgress" x-text="currentProgress"
                class="text-xs text-slate-400 transition-opacity"></span>
        </div>
        <!-- D 方案:节点产物计数 -- 用户在 ⑩ 等 2 分钟时能看到 agent 实际做了什么 -->
        <div x-show="progressDetails" class="mt-1.5 ml-7 text-xs text-slate-500 fade-in"
             x-text="'✓ ' + progressDetails"></div>
      </div>
    </div>

    <!-- 诊断结果卡片(completed 状态) / 推荐检查清单(ongoing_exam 中态) -->
    <!-- X3 fix: 父容器条件需含 recommendedTestGroups(后端 ⑧a 走分组 schema,recommendedTests 留给 ⑫ 写) -->
    <div x-show="diagnosis || (recommendedTests && recommendedTests.length) || (recommendedTestGroups && recommendedTestGroups.length)" class="space-y-4 fade-in">
      <!-- 诊断结果:top1 突出 + top2+ 默认折叠(2026-05-24 Bug A UI 重设计) -->
      <div x-show="diagnosis && diagnosis.length" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-2">
          <div class="w-2 h-2 bg-indigo-600 rounded-full"></div>
          <h3 class="text-sm font-semibold">分诊判断</h3>
        </div>

        <!-- top1: 主诊断(大字 + 把握度 + 依据列表) -->
        <template x-if="diagnosis && diagnosis.length">
          <div class="px-5 py-5">
            <div class="flex items-baseline gap-2 mb-1">
              <span class="text-xs text-slate-500" x-text="diagnosisLeadLabel(diagnosis[0])"></span>
            </div>
            <div class="flex items-baseline justify-between gap-3 mb-3">
              <span class="text-lg font-semibold text-slate-900" x-text="diagnosis[0].disease"></span>
              <span class="text-xs text-slate-500 whitespace-nowrap"
                    x-text="'把握度 ' + (diagnosis[0].probability * 100).toFixed(0) + '%'"></span>
            </div>
            <template x-if="diagnosis[0].evidence && diagnosis[0].evidence.length">
              <div>
                <p class="text-xs font-medium text-slate-700 mb-1.5">本次判断依据</p>
                <ul class="text-xs text-slate-600 space-y-1">
                  <template x-for="e in diagnosis[0].evidence" :key="e">
                    <li class="flex gap-1.5"><span class="text-indigo-400">·</span><span x-text="e"></span></li>
                  </template>
                </ul>
              </div>
            </template>
            <p x-show="diagnosis[0].differentiation"
               class="text-xs text-slate-500 mt-3 pt-3 border-t border-slate-100 italic"
               x-text="'鉴别要点:' + diagnosis[0].differentiation"></p>
          </div>
        </template>

        <!-- top2+: 常驻灰字区(2026-05-24 改:不再折叠,患者直接看,旁边有检查/风险卡引导,不会过度焦虑) -->
        <template x-if="diagnosis && diagnosis.length > 1">
          <div class="border-t border-slate-100 bg-slate-50/40 px-5 py-3">
            <p class="text-[11px] text-slate-400 mb-2 uppercase tracking-wide">其他可能性</p>
            <div class="space-y-2.5">
              <template x-for="d in diagnosis.slice(1)" :key="d.disease">
                <div>
                  <div class="flex items-baseline justify-between mb-0.5">
                    <span class="text-xs font-medium text-slate-500" x-text="d.disease"></span>
                    <span class="text-[11px] text-slate-400" x-text="(d.probability * 100).toFixed(0) + '%'"></span>
                  </div>
                  <template x-if="d.evidence && d.evidence.length">
                    <ul class="text-[11px] text-slate-400 space-y-0.5">
                      <template x-for="e in d.evidence" :key="e">
                        <li class="flex gap-1.5"><span class="text-slate-300">·</span><span x-text="e"></span></li>
                      </template>
                    </ul>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- 用药建议 -->
      <div x-show="medication && medication.length"
           class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-2">
          <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
          <h3 class="text-sm font-semibold">用药建议</h3>
        </div>
        <div class="px-5 py-4 space-y-2">
          <template x-for="m in (medication || [])" :key="JSON.stringify(m)">
            <div class="text-sm border-l-2 border-emerald-200 pl-3 py-1">
              <div class="font-medium" x-text="m.drug_name || m.drug || m.name || '(未命名药品)'"></div>
              <div class="text-xs text-slate-600 mt-0.5" x-text="formatMedicationDose(m)"></div>
              <div x-show="m.notes" class="text-xs text-slate-500 mt-0.5" x-text="'注意:' + m.notes"></div>
            </div>
          </template>
        </div>
      </div>

      <!-- 风险提示 -->
      <div x-show="risks && risks.length"
           class="bg-amber-50 border border-amber-200 rounded-2xl overflow-hidden">
        <div class="px-5 py-4 border-b border-amber-200 flex items-center gap-2">
          <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <h3 class="text-sm font-semibold text-amber-900">风险提示</h3>
        </div>
        <ul class="px-5 py-4 space-y-1.5 text-sm text-amber-900">
          <template x-for="r in (risks || [])" :key="r">
            <li class="flex gap-1.5"><span>·</span><span x-text="r"></span></li>
          </template>
        </ul>
      </div>

      <!-- 推荐检查 + 分框上传(ongoing_exam 中态)— 2026-05-22 X3:每个 group 独立上传框 -->
      <div x-show="recommendedTestGroups && recommendedTestGroups.length"
           class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-2">
          <div class="w-2 h-2 bg-sky-500 rounded-full"></div>
          <h3 class="text-sm font-semibold">请上传以下检查报告</h3>
        </div>
        <div class="px-5 py-4 space-y-5">
          <template x-for="(group, gi) in (recommendedTestGroups || [])" :key="gi">
            <div class="border-b border-slate-100 pb-4 last:border-b-0 last:pb-0">
              <!-- group_label + items + note -->
              <div class="text-sm font-medium mb-1">
                <span class="text-slate-400" x-text="(gi + 1) + '.'"></span>
                <span x-text="group.group_label"></span>
              </div>
              <div x-show="group.items && group.items.length" class="text-xs text-slate-500 ml-4 mb-1">
                含:<span x-text="(group.items || []).join('、')"></span>
              </div>
              <div x-show="group.note" class="text-xs text-slate-400 ml-4 mb-2">
                💡 <span x-text="group.note"></span>
              </div>
              <!-- 上传按钮 + 跳过按钮 + 已上传文件列表 -->
              <div class="ml-4 flex items-center gap-2 flex-wrap">
                <button @click="document.getElementById('examFileInput_' + gi)?.click()"
                        :disabled="examGroupStatus[gi] === 'skipped' || examSubmitting"
                        class="text-xs bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-full px-3 py-1 transition disabled:opacity-40">
                  📁 上传文件
                </button>
                <!-- Alpine :x-ref 不支持动态绑定,改用原生 :id + getElementById -->
                <input type="file" :id="'examFileInput_' + gi" class="hidden"
                       accept="image/*,application/pdf" multiple
                       @change="onExamFilesPicked(gi, $event)">
                <button @click="toggleExamSkip(gi)"
                        :disabled="examSubmitting"
                        :class="examGroupStatus[gi] === 'skipped'
                          ? 'bg-amber-50 text-amber-700 border-amber-200'
                          : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'"
                        class="text-xs border rounded-full px-3 py-1 transition disabled:opacity-40">
                  <span x-text="examGroupStatus[gi] === 'skipped' ? '✓ 已跳过(点击取消)' : '跳过此项'"></span>
                </button>
              </div>
              <div x-show="examGroupFiles[gi] && examGroupFiles[gi].length"
                   class="ml-4 mt-2 flex flex-wrap gap-1.5">
                <template x-for="(f, fi) in (examGroupFiles[gi] || [])" :key="fi">
                  <span class="inline-flex items-center gap-1.5 bg-white border border-slate-200 rounded-full pl-2 pr-1 py-0.5 text-xs text-slate-600">
                    <span x-text="f.name" class="max-w-[10rem] truncate"></span>
                    <button @click="removeExamFile(gi, fi)"
                            :disabled="examSubmitting"
                            class="w-4 h-4 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center disabled:opacity-30">×</button>
                  </span>
                </template>
              </div>
            </div>
          </template>
        </div>
        <div class="px-5 pb-4 pt-2 border-t border-slate-100 flex justify-end items-center gap-2">
          <span x-show="examSubmitting" class="text-xs text-slate-400">上传中…</span>
          <button @click="submitExamReports()"
                  :disabled="examSubmitting || !canSubmitExam()"
                  class="bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl hover:bg-indigo-700 transition disabled:opacity-30">
            提交全部
          </button>
        </div>
      </div>

      <button @click="resetSession()"
              class="w-full bg-white border border-slate-200 text-slate-700 text-sm font-medium py-3 rounded-2xl hover:bg-slate-50 transition">
        开始新问诊
      </button>
    </div>
  </div>

  <!-- ────── 底部输入区 ────── -->
  <!-- 隐藏条件:
       - completed(diagnosis 有值)→ 隐藏(看结果不再输入)
       - ongoing_exam(recommendedTestGroups 非空)→ 隐藏(用卡片内嵌分框入口上传,避免两个入口并存)
       - 其余(首诊 / followup 轮)→ 显示底栏文本框 -->
  <div x-show="!diagnosis && !(recommendedTestGroups && recommendedTestGroups.length)"
       class="fixed bottom-0 inset-x-0 bg-gradient-to-t from-slate-50 via-slate-50 to-transparent pt-6 pb-4 px-4">
    <div class="max-w-3xl mx-auto space-y-2">
      <!-- 已"上传"文件预览(模拟) -->
      <div x-show="uploadedFiles.length" class="flex flex-wrap gap-2">
        <template x-for="(f, i) in uploadedFiles" :key="i">
          <span class="inline-flex items-center gap-1.5 bg-white border border-slate-200 rounded-full pl-3 pr-1.5 py-1 text-xs text-slate-600">
            <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span x-text="f.name" class="max-w-[12rem] truncate"></span>
            <button @click="uploadedFiles.splice(i, 1)" class="w-4 h-4 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center" aria-label="移除">×</button>
          </span>
        </template>
      </div>

      <!-- 底栏文本框:只在没有 pending form 时显示(首次问诊或终态);追问轮全部走气泡内的 form -->
      <div x-show="!pendingForm" class="bg-white border border-slate-200 rounded-2xl shadow-sm flex items-end gap-2 p-2">
        <!-- 上传按钮(模拟,不持久化、不发后端) -->
        <button @click="$refs.fileInput.click()" :disabled="thinking"
                class="text-slate-400 hover:text-indigo-600 w-9 h-9 rounded-xl flex items-center justify-center transition disabled:opacity-30"
                title="上传检查报告(模拟,本 demo 不发后端)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
          </svg>
        </button>
        <input type="file" x-ref="fileInput" class="hidden"
               accept="image/*,application/pdf"
               multiple
               @change="onFilesPicked($event)">
        <textarea x-model="inputText"
                  @keydown.enter.prevent="if(!$event.shiftKey) send()"
                  :placeholder="sessionId ? '请回答上面的问题…' : '请描述您的症状(回车发送,Shift+回车换行)'"
                  rows="1"
                  :disabled="thinking"
                  class="flex-1 resize-none text-sm bg-transparent px-3 py-2 max-h-32 focus:outline-none disabled:opacity-50"
                  x-ref="input"
                  @input="autoGrow($event.target)"></textarea>
        <button @click="send()" :disabled="thinking || !canSend()"
                class="bg-indigo-600 text-white w-9 h-9 rounded-xl flex items-center justify-center hover:bg-indigo-700 transition disabled:opacity-30 disabled:hover:bg-indigo-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
          </svg>
        </button>
      </div>
      <p x-show="apiError" x-text="apiError" class="text-xs text-red-600 text-center mt-2 fade-in"></p>
      <p x-show="uploadToast" x-text="uploadToast"
         class="text-xs text-emerald-600 text-center mt-1 fade-in"></p>
    </div>
  </div>

</main>

<!-- ────────────── App 状态 + 行为 ────────────── -->
<script>
function app() {
  return {
    // ─── 登录 ───
    token: localStorage.getItem('token') || '',
    email: localStorage.getItem('email') || '',
    loginTab: 'demo',
    email_input: '',
    password_input: '',
    loading: false,
    errorMsg: '',
    demos: [
      { email: 'patient1@demo.com', name: '张女士 · 32 岁 · 女',
        tag: '孕 16 周',
        scenario: '演示妊娠期用药安全兜底(safety_gate ⑪)' },
      { email: 'patient2@demo.com', name: '李先生 · 65 岁 · 男',
        tag: '高血压 + 糖尿病 + 青霉素过敏',
        scenario: '演示既往慢病参与诊断推理 + 过敏药拦截' },
      { email: 'patient3@demo.com', name: '王同学 · 25 岁 · 男',
        tag: '无既往史',
        scenario: '首诊新患者基线(看 ④ 自动追问)' },
    ],

    // ─── 聊天 ───
    sessionId: null,
    messages: [],         // [{role: 'user'|'assistant', text|html}]
    inputText: '',
    thinking: false,
    currentProgress: '',  // SSE progress event 推送的当前阶段灰字(thinking=false 时清空)
    progressDetails: '',  // D 方案:node_done event 推送的当前节点产物摘要(如"已召回 200 篇文献")
    apiError: '',

    // ─── 诊断结果 ───
    diagnosis: null,
    medication: null,
    risks: null,
    recommendedTests: null,         // 扁平自然语言建议(⑫ generate_advice 写,⑬ 拼最终回复用)
    recommendedTestGroups: null,    // X3 分框 UI 用:list[{group_label, items, note}]

    // ─── 上传报告(底栏老入口,保留首诊兜底) ───
    uploadedFiles: [],     // [{name, size}]
    uploadToast: '',
    _uploadToastTimer: null,

    // ─── 检查回传分框(X3 ongoing_exam)─── 每框独立状态
    examGroupFiles: {},    // { [gi]: [{name, size, file_ref?}, ...] } 选中的文件
    examGroupStatus: {},   // { [gi]: 'uploaded'|'skipped'|'' } 跳过状态;'' 表示待操作
    examSubmitting: false, // 提交中(disable 按钮防重复点击)

    // ─── 结构化追问 form(气泡内一问一控件) ───
    pendingForm: null,      // null 或 { questions: [{type, slot?, question, target?}, ...] }
    formAnswers: {},        // { [qIndex]: 'text' | {preg: 'yes'|'no'|'unknown', lact: ...} }

    init() {
      // 已登录刷新页面 → 直接进聊天
      if (this.token) this.$nextTick(() => this.$refs.input?.focus());
    },

    // ───────── 登录相关 ─────────
    async loginDemo(email) {
      this.email_input = email;
      this.password_input = 'demo1234';
      await this.manualLogin();
    },

    async manualLogin() {
      this.errorMsg = '';
      if (!this.email_input || !this.password_input) {
        this.errorMsg = '请输入邮箱和密码'; return;
      }
      this.loading = true;
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email_input, password: this.password_input }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `登录失败 (${res.status})`);
        }
        const data = await res.json();
        this.token = data.access_token;
        this.email = this.email_input;
        localStorage.setItem('token', this.token);
        localStorage.setItem('email', this.email);
        this.email_input = ''; this.password_input = '';
        this.$nextTick(() => this.$refs.input?.focus());
      } catch (e) {
        this.errorMsg = e.message || '登录失败';
      } finally {
        this.loading = false;
      }
    },

    async manualRegister() {
      this.errorMsg = '';
      if (!this.email_input || !this.password_input) {
        this.errorMsg = '请输入邮箱和密码'; return;
      }
      if (this.password_input.length < 6) {
        this.errorMsg = '密码至少 6 位'; return;
      }
      this.loading = true;
      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email_input, password: this.password_input, role: 'patient' }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `注册失败 (${res.status})`);
        }
        const data = await res.json();
        this.token = data.access_token;
        this.email = this.email_input;
        localStorage.setItem('token', this.token);
        localStorage.setItem('email', this.email);
        this.email_input = ''; this.password_input = '';
        this.$nextTick(() => this.$refs.input?.focus());
      } catch (e) {
        this.errorMsg = e.message || '注册失败';
      } finally {
        this.loading = false;
      }
    },

    logout() {
      this.token = ''; this.email = '';
      localStorage.removeItem('token'); localStorage.removeItem('email');
      this.resetSession();
    },

    // ───────── 聊天 / 诊断 ─────────
    resetSession() {
      this.sessionId = null;
      this.messages = [];
      this.diagnosis = null;
      this.medication = null;
      this.risks = null;
      this.recommendedTests = null;
      this.recommendedTestGroups = null;
      this.examGroupFiles = {};
      this.examGroupStatus = {};
      this.examSubmitting = false;
      this.apiError = '';
      this.inputText = '';
      this.uploadedFiles = [];
      this.uploadToast = '';
      this.pendingForm = null;
      this.formAnswers = {};
      this.$nextTick(() => this.$refs.input?.focus());
    },

    canSend() {
      // 底栏 send 只用于无 pendingForm 时(首次问诊或 ④ 鉴别诊断回答)
      return !!this.inputText.trim();
    },

    setObstetricChoice(qi, key, value) {
      // formAnswers[qi] 对 obstetric 是个 dict {preg, lact};用 Object.assign 触发 Alpine 响应
      this.formAnswers[qi] = Object.assign({}, this.formAnswers[qi] || {}, { [key]: value });
    },

    _labelForQuestion(q) {
      // 提交时用的"问题简短标签",帮助 LLM 解析:对应 q.type / slot
      if (q.type === 'obstetric')     return '妊娠/哺乳';
      if (q.type === 'history')       return '病史(过敏/慢病/用药)';
      if (q.type === 'open')          return '其他症状';
      if (q.type === 'targeted')      return q.question || q.target || '针对性追问';
      if (q.type === 'report_upload') return '检查报告上传';
      if (q.type === 'slot') {
        // 12 维(HPI sprint:treatment_tried + treatment_response → treatments)
        const m = {
          onset_time: '起病时间', onset_mode: '起病方式', trigger: '诱因',
          location: '部位', nature: '性质', severity: '程度',
          duration_pattern: '时间规律', aggravating: '加重因素', relieving: '缓解因素',
          associated_symptoms: '伴随症状', progression: '病程演变',
          treatments: '诊疗经过',
        };
        return m[q.slot] || q.slot || 'slot';
      }
      return q.type || 'question';
    },

    _serializeFormAnswers() {
      // 把每个 q 的 formAnswers 拼成 "标签:答案" 段落,⑦ LLM 据此回填 slot/symptoms/obstetric/history;
      // type=report_upload 走特殊分支,后端 ①.5 看到 "已上传" 关键字给 state 加 placeholder。
      if (!this.pendingForm) return '';
      const map = { yes: '是', no: '否', unknown: '不清楚' };
      const lines = [];
      this.pendingForm.questions.forEach((q, qi) => {
        const label = this._labelForQuestion(q);
        const a = this.formAnswers[qi];
        if (q.type === 'obstetric') {
          const parts = [];
          if (a && a.preg) parts.push(`怀孕:${map[a.preg]}`);
          if (a && a.lact) parts.push(`哺乳:${map[a.lact]}`);
          if (parts.length) lines.push(`${label} — ${parts.join('; ')}`);
        } else if (q.type === 'report_upload') {
          // X4:用户视角的"我上传了什么"摘要(只用于聊天记录回显,真发后端走 exam_results)
          const groups = a?.groups || [];
          const filled = groups.filter(g => (g.files || []).length > 0);
          if (filled.length) {
            const segs = filled.map((g, i) => {
              const lab = (g.label || '').trim() || `报告${i + 1}`;
              return `${lab}(${g.files.length} 个文件)`;
            });
            lines.push(`${label}:已上传 ${filled.length} 份 — ${segs.join('、')}`);
          } else if (a?.skip) {
            lines.push(`${label}:无`);
          }
        } else if (q.type === 'slot' && q.slot === 'treatments') {
          // treatments 分框:拼成 "<药>: <反应>、<药>: <反应>" 让 ⑦ 直接按 b3 规则解析进 list
          if (a?.skip) {
            lines.push(`${label}:无(未自行处理)`);
          } else if (a?.unknown) {
            lines.push(`${label}:不清楚`);
          } else {
            const entries = (a?.entries || [])
              .map(e => {
                const d = (e.drug || '').trim();
                const r = (e.response || '').trim();
                if (!d && !r) return null;
                if (d && r) return `${d}: ${r}`;
                if (d) return `${d}: 未提及`;
                return null;  // 只有反应没药名,无法配对,跳过
              })
              .filter(Boolean);
            if (entries.length) lines.push(`${label}:${entries.join('、')}`);
          }
        } else {
          const text = (a || '').trim();
          if (text) lines.push(`${label}:${text}`);
        }
      });
      return lines.join('\n');
    },

    // ─── X4: report_upload 分框管理 ──────────────────────────────
    // formAnswers[qi] 结构:{ groups: [{label: '', files: [{name, size, _file}]}], skip: bool }
    // 一框 = 一份独立报告;label 选填(空时后端 fallback "报告N");files 可多(图片多张 / PDF 1 个)
    // _file 留 File 对象,submit 时走 POST /diagnose/upload 真传

    _ensureReportGroups(qi) {
      // 懒初始化:首次访问时给 qi 建立 {groups: [{label,files}], skip: false}
      const cur = this.formAnswers[qi];
      if (cur && Array.isArray(cur.groups)) return cur;
      const init = { groups: [{ label: '', files: [] }], skip: false };
      this.formAnswers[qi] = init;
      return init;
    },

    addReportGroup(qi) {
      const cur = this._ensureReportGroups(qi);
      cur.groups.push({ label: '', files: [] });
      this.formAnswers[qi] = { ...cur, skip: false };
    },

    removeReportGroup(qi, gi) {
      const cur = this._ensureReportGroups(qi);
      if (cur.groups.length <= 1) return;  // 至少保留 1 框(想清空走"无,跳过")
      cur.groups.splice(gi, 1);
      this.formAnswers[qi] = { ...cur };
    },

    setReportGroupLabel(qi, gi, label) {
      const cur = this._ensureReportGroups(qi);
      if (!cur.groups[gi]) return;
      cur.groups[gi].label = label;
      this.formAnswers[qi] = { ...cur };
    },

    onReportGroupFilesPicked(qi, gi, e) {
      // 选了文件就把 skip 关掉;_file 保留给 submit 时 FormData 用
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const cur = this._ensureReportGroups(qi);
      if (!cur.groups[gi]) return;
      const list = (cur.groups[gi].files || []).slice();
      for (const f of files) list.push({ name: f.name, size: f.size, _file: f });
      cur.groups[gi].files = list;
      this.formAnswers[qi] = { ...cur, skip: false };
      e.target.value = '';
    },

    removeReportGroupFile(qi, gi, fi) {
      const cur = this._ensureReportGroups(qi);
      if (!cur.groups[gi]) return;
      const list = (cur.groups[gi].files || []).slice();
      list.splice(fi, 1);
      cur.groups[gi].files = list;
      this.formAnswers[qi] = { ...cur };
    },

    // ─── treatments slot 分框管理(2026-05-23) ──────────────────────────
    // formAnswers[qi] 结构:{ entries: [{drug, response}], skip: bool, unknown: bool }
    // 序列化时按 "<药>: <反应>、..." 拼,⑦ b3 规则直接解析进 treatments list

    _ensureTreatmentEntries(qi) {
      const cur = this.formAnswers[qi];
      if (cur && Array.isArray(cur.entries)) return cur;
      const init = { entries: [{ drug: '', response: '' }], skip: false, unknown: false };
      this.formAnswers[qi] = init;
      return init;
    },

    addTreatmentEntry(qi) {
      const cur = this._ensureTreatmentEntries(qi);
      cur.entries.push({ drug: '', response: '' });
      this.formAnswers[qi] = { ...cur, skip: false, unknown: false };
    },

    removeTreatmentEntry(qi, ei) {
      const cur = this._ensureTreatmentEntries(qi);
      if (cur.entries.length <= 1) return;
      cur.entries.splice(ei, 1);
      this.formAnswers[qi] = { ...cur };
    },

    setTreatmentField(qi, ei, field, value) {
      const cur = this._ensureTreatmentEntries(qi);
      if (!cur.entries[ei]) return;
      cur.entries[ei][field] = value;
      this.formAnswers[qi] = { ...cur, skip: false, unknown: false };
    },

    async submitForm() {
      if (this.thinking || !this.pendingForm) return;

      // X4: 检测 form 是否为 report_upload(①.5 单 question form) → 走真传分支
      // 当前 backend 单点维护 INITIAL_REPORT_UPLOAD_PROMPT,所以"全 report_upload" = "首诊上传"
      const qs = this.pendingForm.questions || [];
      const isReportUploadForm = qs.length > 0 && qs.every(q => q.type === 'report_upload');
      if (isReportUploadForm) {
        await this._submitReportUploadForm();
        return;
      }

      const payload = this._serializeFormAnswers();
      if (!payload) {
        this.apiError = '请至少回答一项后再提交';
        return;
      }
      this.messages.push({ role: 'user', text: payload });
      // 清空 form 状态(下一轮服务端再触发新 pendingForm)
      this.pendingForm = null;
      this.formAnswers = {};
      this.thinking = true;
      this.apiError = '';
      this.$nextTick(() => this.scrollBottom());
      await this._postDiagnose({ session_id: this.sessionId, followup_answer: payload });
    },

    async _submitReportUploadForm() {
      // X4 真传通路:逐 group 逐文件 POST /diagnose/upload → 拿 file_ref,
      // 组装 exam_results 走 /diagnose(SSE)。空 group / skip → exam_results=[] 后端 ①.5 走 PG fallback
      const qs = this.pendingForm.questions || [];
      // 通常只有 1 个 question(INITIAL_REPORT_UPLOAD_PROMPT 单点)
      const summaryLines = [];
      const examResults = [];

      this.thinking = true;
      this.apiError = '';

      try {
        for (let qi = 0; qi < qs.length; qi++) {
          const a = this.formAnswers[qi];
          // 跳过分支:explicit skip 或没传任何文件
          const groups = (a?.groups || []).filter(g => (g.files || []).length > 0);
          if (a?.skip || groups.length === 0) {
            summaryLines.push(`${this._labelForQuestion(qs[qi])}:无`);
            continue;
          }
          // 上传分支:逐 group 逐文件传
          for (let gi = 0; gi < groups.length; gi++) {
            const g = groups[gi];
            const label = (g.label || '').trim() || `报告${gi + 1}`;
            const fileRefs = [];
            for (const f of g.files) {
              if (!f._file) continue;
              const fd = new FormData();
              fd.append('session_id', this.sessionId);
              fd.append('file', f._file);
              const res = await fetch('/diagnose/upload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${this.token}` },
                body: fd,
              });
              if (res.status === 401) { this.logout(); return; }
              if (!res.ok) {
                const eb = await res.json().catch(() => ({}));
                throw new Error(eb.detail || `上传失败 (${res.status})`);
              }
              const data = await res.json();
              fileRefs.push(data.file_ref);
            }
            examResults.push({ group_label: label, files: fileRefs, status: 'uploaded' });
            summaryLines.push(`${label}(${fileRefs.length} 个文件)`);
          }
        }

        // 聊天回显
        const msgText = examResults.length
          ? `已上传 ${examResults.length} 份报告 — ${summaryLines.join('、')}`
          : (summaryLines.join('\n') || '无,跳过');
        this.messages.push({ role: 'user', text: msgText });

        // 清空 form 状态 + 进入下一轮
        this.pendingForm = null;
        this.formAnswers = {};
        this.$nextTick(() => this.scrollBottom());
        await this._postDiagnose({ session_id: this.sessionId, exam_results: examResults });
      } catch (err) {
        this.apiError = err.message || '上传报告失败';
        this.thinking = false;
      }
    },

    async send() {
      const text = this.inputText.trim();
      if (!text || this.thinking) return;
      this.messages.push({ role: 'user', text });
      this.inputText = '';
      this.thinking = true;
      this.apiError = '';
      this.$nextTick(() => this.scrollBottom());

      const body = this.sessionId
        ? { session_id: this.sessionId, followup_answer: text }
        : { patient_input: text };
      await this._postDiagnose(body);
    },

    async _postDiagnose(body) {
      // 走 SSE:fetch + ReadableStream 按行解析 `data: {...}\n\n`;
      // progress event → currentProgress 灰字;interrupt/completed/error → 走原终态逻辑
      this.currentProgress = '';
      this.progressDetails = '';  // D:每次新请求清空上轮 done 摘要
      let gotTerminal = false;  // 收到 interrupt / completed / error 即视为正常终止
      try {
        const res = await fetch('/diagnose', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'text/event-stream',
            'Authorization': `Bearer ${this.token}`,
          },
          body: JSON.stringify(body),
        });

        if (res.status === 401) { this.logout(); return; }
        if (!res.ok) {
          // 4xx 仍走 JSON(SSE generator 启动前 raise HTTPException 那一段)
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.detail || `请求失败 (${res.status})`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // SSE 消息以 \n\n 分隔
          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const rawMsg = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            for (const line of rawMsg.split('\n')) {
              if (!line.startsWith('data:')) continue;
              let evt;
              try { evt = JSON.parse(line.slice(5).trim()); }
              catch { continue; }
              gotTerminal = this._handleSseEvent(evt) || gotTerminal;
            }
          }
        }

        if (!gotTerminal) {
          // 流正常关了但没收到任何终止 event — 后端 generator 异常退出
          throw new Error('诊断服务连接中断,请稍后重试');
        }
      } catch (e) {
        this.apiError = e.message || '请求失败';
      } finally {
        this.thinking = false;
        this.currentProgress = '';
        this.progressDetails = '';
        this.$nextTick(() => this.scrollBottom());
      }
    },

    _handleSseEvent(evt) {
      // 处理一条 SSE event;返回 true 表示终止 event(用于外层检测意外断流)
      if (evt.event === 'progress') {
        this.currentProgress = evt.text || '';
        // 新节点开始,清空上一节点的 done 摘要,避免错位
        this.progressDetails = '';
        this.$nextTick(() => this.scrollBottom());
        return false;
      }
      if (evt.event === 'node_done') {
        // D 方案:节点完成时显示中间产物计数,让用户知道 agent 实际做了什么
        this.progressDetails = evt.summary || '';
        this.$nextTick(() => this.scrollBottom());
        return false;
      }
      if (evt.event === 'interrupt') {
        this.sessionId = evt.session_id || this.sessionId;
        if (evt.status === 'ongoing_initial_ask'
            || evt.status === 'ongoing_followup'
            || evt.status === 'ongoing_report_upload') {
          // 三种 form 类型走同一个 pendingForm 渲染机制(form template 按 q.type 分流)
          const pq = evt.pending_questions || [];
          if (pq.length) {
            this.pendingForm = { questions: pq };
            this.formAnswers = {};
          } else {
            this.pendingForm = null;
            const pqText = evt.pending_question || '(系统未返回问题)';
            this.messages.push({
              role: 'assistant',
              text: pqText,
              html: this.mdToHtml(pqText),
            });
          }
        } else if (evt.status === 'ongoing_exam') {
          // X3:分组结构直接喂给卡片内嵌分框 UI(N 组 → N 框 + 上传 + 跳过 + 提交)
          this.recommendedTestGroups = evt.recommended_test_groups || [];
          // 初始化每组的本地 state(files/status 空)
          this.examGroupFiles = {};
          this.examGroupStatus = {};
          this.messages.push({
            role: 'assistant',
            text: '根据现有信息,建议您先做以下检查后回来上传报告:',
          });
        }
        return true;
      }
      if (evt.event === 'completed') {
        this.sessionId = evt.session_id || this.sessionId;
        const finalText = evt.final_response || '(完成)';
        this.messages.push({
          role: 'assistant',
          text: finalText,
          html: this.mdToHtml(finalText),
        });
        this.diagnosis = evt.diagnosis_result || [];
        this.medication = evt.medication_advice || [];
        this.risks = evt.risk_warnings || [];
        this.recommendedTests = evt.recommended_tests || null;
        return true;
      }
      if (evt.event === 'error') {
        this.apiError = evt.detail || '诊断服务暂不可用';
        return true;
      }
      return false;
    },

    autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    },

    formatMedicationDose(m) {
      const parts = [];
      if (m.dosage) parts.push(m.dosage);
      if (m.frequency) parts.push(m.frequency);
      if (m.duration) parts.push('疗程 ' + m.duration);
      return parts.join(' · ');
    },

    mdToHtml(text) {
      if (!text) return '';
      // HTML 转义优先,防 XSS
      const escaped = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
      // 简易 markdown:粗体 / 斜体 / 行内代码 / 列表项前缀
      return escaped
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
        .replace(/`([^`\n]+)`/g, '<code class="bg-slate-100 px-1 rounded">$1</code>')
        .replace(/^(\s*)[-•]\s+/gm, '$1· ');
    },

    scrollBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    },

    onFilesPicked(e) {
      // 模拟上传:只收文件名,不发后端、不持久化
      const files = Array.from(e.target.files || []);
      for (const f of files) {
        this.uploadedFiles.push({ name: f.name, size: f.size });
      }
      e.target.value = '';  // 允许重复选同名文件
      if (!files.length) return;
      this.uploadToast = `已收到 ${files.length} 个文件(模拟,本 demo 不发后端解析)`;
      clearTimeout(this._uploadToastTimer);
      this._uploadToastTimer = setTimeout(() => { this.uploadToast = ''; }, 3000);
    },

    // ───────── X3 检查回传分框相关 ─────────
    onExamFilesPicked(gi, e) {
      // 暂存到 examGroupFiles[gi],不立刻上传(submitExamReports 时统一传)
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const list = this.examGroupFiles[gi] || [];
      for (const f of files) {
        list.push({ name: f.name, size: f.size, _file: f });  // _file 留着 submit 时 FormData 用
      }
      this.examGroupFiles[gi] = list;
      // 选了文件就把 status 置 'uploaded'(覆盖 'skipped')
      if (this.examGroupStatus[gi] === 'skipped') this.examGroupStatus[gi] = 'uploaded';
      e.target.value = '';
    },

    removeExamFile(gi, fi) {
      const list = this.examGroupFiles[gi] || [];
      list.splice(fi, 1);
      this.examGroupFiles[gi] = list;
    },

    toggleExamSkip(gi) {
      if (this.examGroupStatus[gi] === 'skipped') {
        this.examGroupStatus[gi] = '';
      } else {
        this.examGroupStatus[gi] = 'skipped';
        this.examGroupFiles[gi] = [];  // 跳过就清空文件
      }
    },

    canSubmitExam() {
      // 至少有一组有文件 OR 有一组标了 skipped — 全空白不让提交
      if (!this.recommendedTestGroups) return false;
      for (let gi = 0; gi < this.recommendedTestGroups.length; gi++) {
        const files = this.examGroupFiles[gi] || [];
        if (files.length > 0) return true;
        if (this.examGroupStatus[gi] === 'skipped') return true;
      }
      return false;
    },

    async submitExamReports() {
      if (this.examSubmitting || !this.canSubmitExam()) return;
      this.examSubmitting = true;
      this.apiError = '';
      try {
        // 1. 逐组逐文件 POST /diagnose/upload,收集 file_refs
        const examResults = [];
        for (let gi = 0; gi < this.recommendedTestGroups.length; gi++) {
          const group = this.recommendedTestGroups[gi];
          const files = this.examGroupFiles[gi] || [];
          const skipped = this.examGroupStatus[gi] === 'skipped';
          if (skipped) {
            examResults.push({
              group_label: group.group_label,
              files: [],
              status: 'skipped',
            });
            continue;
          }
          if (!files.length) continue;  // 未操作的组直接跳(后端 ⑨ 看不到该组等于未做)
          const fileRefs = [];
          for (const f of files) {
            const fd = new FormData();
            fd.append('session_id', this.sessionId);
            fd.append('file', f._file);
            const res = await fetch('/diagnose/upload', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${this.token}` },
              body: fd,
            });
            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`上传 ${f.name} 失败 (${res.status}): ${errText.slice(0, 200)}`);
            }
            const data = await res.json();
            fileRefs.push(data.file_ref);
          }
          examResults.push({
            group_label: group.group_label,
            files: fileRefs,
            status: 'uploaded',
          });
        }

        // 2. 用户消息气泡反馈"已提交"
        const summary = examResults.map(r => {
          if (r.status === 'skipped') return `${r.group_label}: 跳过`;
          return `${r.group_label}: ${r.files.length} 个文件`;
        }).join('\n');
        this.messages.push({ role: 'user', text: `已上传检查报告:\n${summary}` });

        // 3. 清空分框 UI 状态 + 把 recommendedTestGroups 清掉(避免重复提交)
        this.recommendedTestGroups = null;
        this.recommendedTests = null;
        this.examGroupFiles = {};
        this.examGroupStatus = {};
        this.thinking = true;
        this.$nextTick(() => this.scrollBottom());

        // 4. POST /diagnose with exam_results,SSE 走老链路
        await this._postDiagnose({
          session_id: this.sessionId,
          exam_results: examResults,
        });
      } catch (e) {
        this.apiError = e.message || '上传或提交失败';
      } finally {
        this.examSubmitting = false;
      }
    },
  };
}
</script>

<style>
  [x-cloak] { display: none !important; }
</style>

</body>
